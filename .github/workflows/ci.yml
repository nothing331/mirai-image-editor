name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      MIRAI_AI_ENABLED: "false"
      MIRAI_APP_MODE: ci
      MIRAI_PERSISTENCE_MODE: local
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure fake providers
        run: cp .env.example .env.local

      - name: Install dependencies
        run: npm ci

      - name: Validate runtime configuration
        run: npm run cloud:config:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Confirm generated files are not tracked
        run: git diff --exit-code

  account-database:
    name: Cloud migration, RLS, Storage, and pgTAP
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies for Storage integration
        run: npm ci

      - name: Start local Supabase
        run: npx --yes supabase@2.116.0 start

      - name: Rebuild from migrations
        run: npx --yes supabase@2.116.0 db reset --local

      - name: Lint cloud schemas
        run: npx --yes supabase@2.116.0 db lint --local --schema public,mirai_private --level warning --fail-on error

      - name: Run security advisors
        run: npx --yes supabase@2.116.0 db advisors --local --type security --level warn --fail-on error

      - name: Test account authorization
        run: npx --yes supabase@2.116.0 test db --local supabase/tests/accounts_and_access_test.sql

      - name: Test private asset quotas and access
        run: npx --yes supabase@2.116.0 test db --local supabase/tests/private_asset_foundation_test.sql

      - name: Test private Storage integration
        run: MIRAI_ASSET_INTEGRATION=1 npx vitest run src/server/assets/original-assets.integration.test.ts

      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@2.116.0 stop --no-backup
