name: Cloud maintenance

on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected environment
        required: true
        type: choice
        options: [staging, beta]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: cloud-maintenance-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target || 'staging' }}
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/cloud-maintenance/run.mjs
